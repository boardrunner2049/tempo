[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-cosim"
version = "0.1.0"
description = "A fast, observable co-simulation scheduler with a native runtime and a Python control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cffi>=1.16"]

[project.optional-dependencies]
dev = ["pytest>=8", "meson>=1.3", "ninja"]

[project.scripts]
tempo-run = "tempo.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
